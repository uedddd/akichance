<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏢 空きチャンス — 打合せ机 予約・使用状況</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f0f2f5;
            color: #333;
        }

        /* ヘッダー */
        .header {
            background: #1a1a2e;
            color: white;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header-title { font-size: 20px; font-weight: bold; }
        .connection-status { display: flex; align-items: center; gap: 8px; font-size: 13px; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #888; }
        .status-dot.connected    { background: #4CAF50; }
        .status-dot.disconnected { background: #F44336; }
        .status-dot.connecting   { background: #FF9800; }

        /* 集計バー */
        .summary-bar {
            background: white;
            padding: 12px 24px;
            display: flex;
            gap: 24px;
            border-bottom: 1px solid #e0e0e0;
            flex-wrap: wrap;
            align-items: center;
        }
        .summary-item { display: flex; align-items: center; gap: 8px; }
        .summary-count { font-size: 24px; font-weight: bold; }
        .summary-label { font-size: 13px; color: #666; }
        .count-total    { color: #1a1a2e; }
        .count-empty    { color: #4CAF50; }
        .count-in-use   { color: #F44336; }
        .count-reserved { color: #FF9800; }

        /* 凡例 */
        .legend {
            background: white;
            padding: 10px 24px;
            display: flex;
            gap: 20px;
            border-bottom: 1px solid #e0e0e0;
            flex-wrap: wrap;
            align-items: center;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; font-size: 13px; }
        .legend-dot { width: 14px; height: 14px; border-radius: 3px; }

        /* タブ */
        .tabs {
            background: white;
            padding: 0 24px;
            display: flex;
            border-bottom: 2px solid #e0e0e0;
        }
        .tab-btn {
            padding: 14px 24px;
            border: none;
            background: none;
            font-size: 14px;
            font-weight: bold;
            color: #888;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            transition: color 0.2s, border-color 0.2s;
        }
        .tab-btn.active { color: #1a1a2e; border-bottom-color: #1a1a2e; }
        .tab-btn:hover  { color: #1a1a2e; }

        /* タブコンテンツ */
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* メイン */
        .main { padding: 24px; max-width: 1400px; margin: 0 auto; }

        /* 階切替 */
        .floor-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .section-title { font-size: 18px; font-weight: bold; color: #1a1a2e; }
        .floor-tabs { display: flex; gap: 8px; }
        .floor-btn {
            padding: 8px 20px;
            border: 2px solid #1a1a2e;
            background: white;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            color: #1a1a2e;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }
        .floor-btn.active { background: #1a1a2e; color: white; }
        .floor-btn:hover:not(.active) { background: #f0f2f5; }

        /* フロアコンテンツ */
        .floor-content { display: none; }
        .floor-content.active { display: block; }

        /* 席グリッド */
        .seats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
        }

        /* 席カード */
        .seat-card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border-left: 5px solid #ccc;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .seat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
        }
        .seat-card.available { border-left-color: #4CAF50; }
        .seat-card.in_use    { border-left-color: #F44336; }
        .seat-card.reserved  { border-left-color: #FF9800; }

        .seat-card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .seat-name { font-size: 15px; font-weight: bold; }
        .seat-capacity {
            font-size: 12px;
            color: #888;
            background: #f0f2f5;
            padding: 2px 8px;
            border-radius: 10px;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            color: white;
            margin-bottom: 6px;
        }
        .badge-available { background: #4CAF50; }
        .badge-in_use    { background: #F44336; }
        .badge-reserved  { background: #FF9800; }

        .seat-detail  { font-size: 12px; color: #666; margin-bottom: 4px; min-height: 16px; }
        .seat-monitor { font-size: 12px; color: #1976D2; margin-bottom: 10px; }

        /* 予約ボタン */
        .reserve-btn {
            width: 100%;
            padding: 8px;
            border: 1px solid #1a1a2e;
            background: white;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            color: #1a1a2e;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            margin-top: 8px;
        }
        .reserve-btn:hover { background: #1a1a2e; color: white; }

        /* キャンセルボタン */
        .cancel-btn {
            width: 100%;
            padding: 8px;
            border: 1px solid #F44336;
            background: white;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            color: #F44336;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            margin-top: 6px;
        }
        .cancel-btn:hover { background: #F44336; color: white; }

        /* 更新アニメーション */
        @keyframes flash {
            0%   { opacity: 1; }
            50%  { opacity: 0.4; }
            100% { opacity: 1; }
        }
        .seat-card.updating { animation: flash 0.6s ease-in-out; }

        /* ========================================
           タイムライン
           1時間 = 240px（15分 = 60px）
        ======================================== */
        .timeline-wrap { overflow-x: auto; }

        .timeline-table {
            border-collapse: collapse;
            min-width: 100%;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        /* 席名列 */
        .tl-label-col { width: 160px; min-width: 160px; }

        /* 時間列：15分 = 60px */
        .tl-time-col { width: 60px; min-width: 60px; }

        .timeline-table thead th {
            background: #f0f2f5;
            padding: 10px 0;
            font-size: 12px;
            font-weight: bold;
            color: #666;
            text-align: center;
            border-right: 1px solid #e0e0e0;
            border-bottom: 1px solid #e0e0e0;
            white-space: nowrap;
        }
        .timeline-table thead th.tl-label-col {
            text-align: left;
            padding-left: 12px;
        }

        /* 境界線：正時は濃く、30分は薄く、15分は点線 */
        .tl-border-hour   { border-right: 2px solid #bbb !important; }
        .tl-border-half   { border-right: 1px solid #ddd !important; }
        .tl-border-quarter{ border-right: 1px dashed #e8e8e8 !important; }

        .timeline-table tbody tr { border-bottom: 1px solid #f0f2f5; }
        .timeline-table tbody tr:last-child { border-bottom: none; }

        .tl-label {
            padding: 0 10px;
            font-size: 13px;
            font-weight: bold;
            color: #333;
            border-right: 2px solid #e0e0e0;
            white-space: nowrap;
            height: 44px;
            vertical-align: middle;
        }

        /* データセル */
        .tl-cell {
            position: relative;
            height: 44px;
            padding: 0;
            vertical-align: middle;
        }

        /* 予約ブロック：絶対配置で複数セルをまたぐ */
        .tl-block {
            position: absolute;
            top: 6px;
            bottom: 6px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            padding: 0 8px;
            font-size: 11px;
            font-weight: bold;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            z-index: 1;
            cursor: default;
        }
        .tl-block.reserved { background: #FF9800; }
        .tl-block.in_use   { background: #F44336; }

        /* モーダル */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.open { display: flex; }

        .modal {
            background: white;
            border-radius: 16px;
            padding: 28px;
            width: 400px;
            max-width: 90vw;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        .modal-title { font-size: 18px; font-weight: bold; margin-bottom: 20px; color: #1a1a2e; }

        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 13px; font-weight: bold; color: #555; margin-bottom: 6px; }
        .form-input, .form-select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            color: #333;
            background: white;
        }
        .form-input:focus, .form-select:focus { outline: none; border-color: #1a1a2e; }
        .form-input[readonly] { background: #f0f2f5; color: #888; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .modal-buttons { display: flex; gap: 12px; margin-top: 24px; }
        .btn-confirm {
            flex: 1; padding: 12px;
            background: #1a1a2e; color: white;
            border: none; border-radius: 8px;
            font-size: 14px; font-weight: bold; cursor: pointer;
        }
        .btn-confirm:hover { background: #2d2d5e; }
        .btn-cancel {
            flex: 1; padding: 12px;
            background: white; color: #333;
            border: 1px solid #ddd; border-radius: 8px;
            font-size: 14px; font-weight: bold; cursor: pointer;
        }
        .btn-cancel:hover { background: #f0f2f5; }

        /* 確認ダイアログ */
        .confirm-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .confirm-overlay.open { display: flex; }
        .confirm-dialog {
            background: white;
            border-radius: 16px;
            padding: 28px;
            width: 360px;
            max-width: 90vw;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            text-align: center;
        }
        .confirm-icon  { font-size: 40px; margin-bottom: 12px; }
        .confirm-title { font-size: 16px; font-weight: bold; margin-bottom: 8px; color: #1a1a2e; }
        .confirm-text  { font-size: 14px; color: #666; margin-bottom: 24px; }
        .confirm-buttons { display: flex; gap: 12px; }
        .btn-danger {
            flex: 1; padding: 12px;
            background: #F44336; color: white;
            border: none; border-radius: 8px;
            font-size: 14px; font-weight: bold; cursor: pointer;
        }
        .btn-danger:hover { background: #d32f2f; }

        /* ローディング・エラー */
        .loading { text-align: center; padding: 60px; color: #888; font-size: 16px; }
        .error-message {
            background: #ffebee; border: 1px solid #F44336;
            border-radius: 8px; padding: 16px; color: #c62828; margin-bottom: 20px;
        }

        .toast {
            position: fixed; bottom: 24px; right: 24px;
            background: #1a1a2e; color: white;
            padding: 14px 20px; border-radius: 10px;
            font-size: 14px; box-shadow: 0 4px 16px rgba(0,0,0,0.2);
            z-index: 3000; display: none;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { transform: translateY(20px); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }
    </style>
</head>
<body>

<!-- ヘッダー -->
<div class="header">
    <div class="header-title">🏢 空きチャンス — 打合せ机 予約・使用状況</div>
    <div class="connection-status">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">接続中...</span>
    </div>
</div>

<!-- 集計バー -->
<div class="summary-bar">
    <div class="summary-item">
        <span class="summary-count count-total"    id="countTotal">-</span>
        <span class="summary-label">総席数</span>
    </div>
    <div class="summary-item">
        <span class="summary-count count-empty"    id="countEmpty">-</span>
        <span class="summary-label">空き</span>
    </div>
    <div class="summary-item">
        <span class="summary-count count-in-use"   id="countInUse">-</span>
        <span class="summary-label">使用中</span>
    </div>
    <div class="summary-item">
        <span class="summary-count count-reserved" id="countReserved">-</span>
        <span class="summary-label">予約済み</span>
    </div>
</div>

<!-- 凡例 -->
<div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#4CAF50"></div><span>空き</span></div>
    <div class="legend-item"><div class="legend-dot" style="background:#F44336"></div><span>使用中</span></div>
    <div class="legend-item"><div class="legend-dot" style="background:#FF9800"></div><span>予約済み</span></div>
    <div class="legend-item" style="font-size:13px;color:#555;">🖥️ モニター有</div>
</div>

<!-- タブ -->
<div class="tabs">
    <button class="tab-btn active" onclick="switchTab('map')">🗺️ フロアマップ</button>
    <button class="tab-btn"        onclick="switchTab('timeline')">📅 タイムライン</button>
</div>

<!-- フロアマップ タブ -->
<div class="tab-content active" id="tab-map">
    <div class="main">
        <div class="error-message" id="errorMessage" style="display:none;"></div>
        <div class="loading" id="loadingMessage">⏳ データを読み込み中...</div>

        <div id="floorMapArea" style="display:none;">
            <div class="floor-header">
                <div class="section-title">🗺️ フロアマップ —</div>
                <div class="floor-tabs" id="mapFloorTabs"></div>
            </div>
            <div id="mapFloorContents"></div>
        </div>
    </div>
</div>

<!-- タイムライン タブ -->
<div class="tab-content" id="tab-timeline">
    <div class="main">
        <div class="floor-header">
            <div class="section-title">📅 タイムライン（9:00〜18:00）—</div>
            <div class="floor-tabs" id="tlFloorTabs"></div>
        </div>
        <div id="tlFloorContents"></div>
    </div>
</div>

<!-- 予約モーダル -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <div class="modal-title">📝 予約フォーム</div>
        <div class="form-group">
            <label class="form-label">席名</label>
            <input class="form-input" id="formSeatName" type="text" readonly>
            <input type="hidden" id="formSeatId">
        </div>
        <div class="form-group">
            <label class="form-label">予約者名</label>
            <input class="form-input" id="formUserName" type="text" placeholder="例：田中 太郎">
        </div>
        <div class="form-group">
            <label class="form-label">メールアドレス</label>
            <input class="form-input" id="formEmail" type="email" placeholder="例：tanaka@example.com">
        </div>
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">開始時間</label>
                <select class="form-select" id="formStartTime">
                    <option>9:00</option><option>9:30</option>
                    <option>10:00</option><option>10:30</option>
                    <option>11:00</option><option>11:30</option>
                    <option>12:00</option><option>12:30</option>
                    <option>13:00</option><option>13:30</option>
                    <option>14:00</option><option>14:30</option>
                    <option>15:00</option><option>15:30</option>
                    <option>16:00</option><option>16:30</option>
                    <option>17:00</option><option>17:30</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">終了時間</label>
                <select class="form-select" id="formEndTime">
                    <option>9:30</option>
                    <option>10:00</option><option>10:30</option>
                    <option>11:00</option><option>11:30</option>
                    <option>12:00</option><option>12:30</option>
                    <option>13:00</option><option>13:30</option>
                    <option>14:00</option><option>14:30</option>
                    <option>15:00</option><option>15:30</option>
                    <option>16:00</option><option>16:30</option>
                    <option>17:00</option><option>17:30</option>
                    <option>18:00</option>
                </select>
            </div>
        </div>
        <div class="modal-buttons">
            <button class="btn-confirm" onclick="submitReservation()">予約確定</button>
            <button class="btn-cancel"  onclick="closeModal()">キャンセル</button>
        </div>
    </div>
</div>

<!-- キャンセル確認ダイアログ -->
<div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-dialog">
        <div class="confirm-icon">⚠️</div>
        <div class="confirm-title">予約をキャンセルしますか？</div>
        <div class="confirm-text"  id="confirmText"></div>
        <div class="confirm-buttons">
            <button class="btn-danger"  id="confirmOkBtn">キャンセルする</button>
            <button class="btn-cancel"  onclick="closeConfirm()">戻る</button>
        </div>
    </div>
</div>

<!-- トースト -->
<div class="toast" id="toast"></div>

<script>
// ============================================================
// 定数
// ============================================================
const API_BASE = '';

// タイムライン設定
// 9:00 〜 18:00 を 15分単位で表示
const TL_START_MIN = 9 * 60;        // 540分
const TL_END_MIN   = 18 * 60;       // 1080分
const TL_UNIT_MIN  = 15;            // 15分単位
const TL_CELL_PX   = 60;            // 1セル（15分）= 60px
const TL_SLOTS     = (TL_END_MIN - TL_START_MIN) / TL_UNIT_MIN; // 36スロット

const STATUS_LABEL = {
    available : '空き',
    empty     : '空き',
    in_use    : '使用中',
    reserved  : '予約済み',
    completed : '完了',
    expired   : '期限切れ',
    cancelled : 'キャンセル',
};
const STATUS_CLASS = {
    available : 'available',
    empty     : 'available',
    in_use    : 'in_use',
    reserved  : 'reserved',
    completed : 'available',
    expired   : 'available',
    cancelled : 'available',
};

// ============================================================
// 状態管理
// ============================================================
let seatsData        = [];
let reservationsData = [];
let floorsData       = [];

// 現在時刻を分で返す
function nowMinutes() {
    const d = new Date();
    return d.getHours() * 60 + d.getMinutes();
}

// ============================================================
// 席の「表示用ステータス」を計算する
// DB の status ではなく、現在時刻と予約を考慮した表示ステータスを返す
// ============================================================
function getDisplayStatus(seat) {
    const dbStatus = seat.status || 'empty';

    // DBが in_use ならそのまま
    if (dbStatus === 'in_use') return 'in_use';

    // 現在時刻に有効な予約があれば reserved 表示
    const nowMin = nowMinutes();
    const activeReservation = reservationsData.find(r =>
        r.seat_id === seat.seat_id &&
        r.status === 'reserved' &&
        timeToMinutesFromISO(r.start_datetime) <= nowMin &&
        timeToMinutesFromISO(r.end_datetime)   >  nowMin
    );
    if (activeReservation) return 'reserved';

    // それ以外は空き
    return 'available';
}

// 直近（未来）の予約を取得する
function getUpcomingReservation(seatId) {
    const nowMin = nowMinutes();
    const upcoming = reservationsData
        .filter(r =>
            r.seat_id === seatId &&
            r.status  === 'reserved' &&
            timeToMinutesFromISO(r.end_datetime) > nowMin
        )
        .sort((a, b) =>
            timeToMinutesFromISO(a.start_datetime) -
            timeToMinutesFromISO(b.start_datetime)
        );
    return upcoming.length > 0 ? upcoming[0] : null;
}

// ============================================================
// タブ・階切替
// ============================================================
function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach((btn, i) => {
        btn.classList.toggle('active', (tab === 'map' ? i === 0 : i === 1));
    });
    document.getElementById('tab-map').classList.toggle('active',      tab === 'map');
    document.getElementById('tab-timeline').classList.toggle('active', tab === 'timeline');
}

function switchFloor(prefix, floorId) {
    document.querySelectorAll(`#${prefix}FloorTabs .floor-btn`).forEach(btn => {
        btn.classList.toggle('active', btn.dataset.floorId === String(floorId));
    });
    document.querySelectorAll(`#${prefix}FloorContents .floor-content`).forEach(el => {
        el.classList.toggle('active', el.dataset.floorId === String(floorId));
    });
}

// ============================================================
// 集計バー
// ============================================================
function updateSummary() {
    const total    = seatsData.length;
    let empty = 0, inUse = 0, reserved = 0;

    seatsData.forEach(seat => {
        const ds = getDisplayStatus(seat);
        if      (ds === 'in_use')   inUse++;
        else if (ds === 'reserved') reserved++;
        else                        empty++;
    });

    document.getElementById('countTotal').textContent    = total;
    document.getElementById('countEmpty').textContent    = empty;
    document.getElementById('countInUse').textContent    = inUse;
    document.getElementById('countReserved').textContent = reserved;
}

// ============================================================
// フロア階タブを動的生成
// ============================================================
function buildFloorTabs() {
    ['map', 'tl'].forEach(prefix => {
        const tabsEl     = document.getElementById(`${prefix}FloorTabs`);
        const contentsEl = document.getElementById(`${prefix}FloorContents`);
        tabsEl.innerHTML     = '';
        contentsEl.innerHTML = '';

        floorsData.forEach((floor, idx) => {
            // ボタン
            const btn = document.createElement('button');
            btn.className       = 'floor-btn' + (idx === 0 ? ' active' : '');
            btn.textContent     = floor.floor_name;
            btn.dataset.floorId = floor.floor_id;
            btn.onclick         = () => switchFloor(prefix, floor.floor_id);
            tabsEl.appendChild(btn);

            // コンテンツ
            const div = document.createElement('div');
            div.className       = 'floor-content' + (idx === 0 ? ' active' : '');
            div.dataset.floorId = floor.floor_id;
            div.id              = `${prefix}-floor-${floor.floor_id}`;

            if (prefix === 'map') {
                div.innerHTML = `<div class="seats-grid" id="seatsGrid-${floor.floor_id}"></div>`;
            } else {
                div.innerHTML = `<div class="timeline-wrap" id="timelineWrap-${floor.floor_id}"></div>`;
            }
            contentsEl.appendChild(div);
        });
    });
}

// ============================================================
// フロアマップ 描画
// ============================================================
function createSeatCardHTML(seat) {
    const displayStatus = getDisplayStatus(seat);
    const statusLabel   = STATUS_LABEL[displayStatus] || displayStatus;
    const statusClass   = STATUS_CLASS[displayStatus] || 'available';

    const upcoming = getUpcomingReservation(seat.seat_id);

    // 詳細テキスト
    let detailText = '本日空き';
    if (displayStatus === 'reserved' && upcoming) {
        detailText = `${formatTime(upcoming.start_datetime)}〜${formatTime(upcoming.end_datetime)}`;
    } else if (displayStatus === 'in_use') {
        detailText = '現在使用中';
    } else if (upcoming) {
        detailText = `次: ${formatTime(upcoming.start_datetime)}〜${formatTime(upcoming.end_datetime)}`;
    }

    const capacityHtml = seat.capacity
        ? `<span class="seat-capacity">${seat.capacity}名</span>` : '';

    const monitorHtml = seat.has_monitor
        ? `<div class="seat-monitor">🖥️ モニター有</div>` : '';

    // キャンセルボタン（直近予約がある場合のみ）
    const cancelBtnHtml = upcoming
        ? `<button class="cancel-btn"
               onclick="openConfirm(${upcoming.reservation_id}, '${seat.seat_name}',
               '${formatTime(upcoming.start_datetime)}〜${formatTime(upcoming.end_datetime)}')">
               予約キャンセル
           </button>`
        : '';

    return `
        <div class="seat-card ${statusClass}"
             id="seat-card-${seat.seat_id}"
             data-seat-id="${seat.seat_id}">
            <div class="seat-card-header">
                <div class="seat-name">${seat.seat_name}</div>
                ${capacityHtml}
            </div>
            <span class="status-badge badge-${statusClass}">${statusLabel}</span>
            <div class="seat-detail">${detailText}</div>
            ${monitorHtml}
            <button class="reserve-btn"
                    onclick="openModal(${seat.seat_id}, '${seat.seat_name}')">
                予約する
            </button>
            ${cancelBtnHtml}
        </div>
    `;
}

function renderSeats() {
    floorsData.forEach(floor => {
        const grid = document.getElementById(`seatsGrid-${floor.floor_id}`);
        if (!grid) return;

        const floorSeats = seatsData.filter(s => s.floor_id === floor.floor_id);

        grid.innerHTML = floorSeats.length > 0
            ? floorSeats.map(createSeatCardHTML).join('')
            : '<div style="color:#888;padding:20px;">この階の席データがありません</div>';
    });

    document.getElementById('loadingMessage').style.display = 'none';
    document.getElementById('floorMapArea').style.display   = 'block';
    updateSummary();
}

// ============================================================
// タイムライン 描画
// 15分単位・ブロック幅を予約時間に応じて計算
// ============================================================
function renderTimelines() {
    floorsData.forEach(floor => {
        const wrap = document.getElementById(`timelineWrap-${floor.floor_id}`);
        if (!wrap) return;

        const floorSeats = seatsData.filter(s => s.floor_id === floor.floor_id);

        if (floorSeats.length === 0) {
            wrap.innerHTML = '<div style="color:#888;padding:20px;">この階の席データがありません</div>';
            return;
        }

        // ---- ヘッダー行を構築 ----
        // 9:00〜18:00 を 15分刻みで生成
        // 正時のみラベルを表示、他は空
        let headerCells = `<th class="tl-label-col">席名</th>`;
        for (let i = 0; i < TL_SLOTS; i++) {
            const minFromStart = i * TL_UNIT_MIN;
            const absMin       = TL_START_MIN + minFromStart;
            const isHour       = absMin % 60 === 0;
            const isHalf       = absMin % 30 === 0 && !isHour;
            const borderClass  = isHour ? 'tl-border-hour' : isHalf ? 'tl-border-half' : 'tl-border-quarter';
            const label        = isHour
                ? `${Math.floor(absMin / 60)}:00`
                : '';
            headerCells += `<th class="tl-time-col ${borderClass}">${label}</th>`;
        }

        // ---- データ行を構築 ----
        // 各セルは空のtdを並べ、予約ブロックは最初のセルに absolute 配置する
        const rows = floorSeats.map(seat => {
            const monitorIcon = seat.has_monitor ? ' 🖥️' : '';

            // この席の有効な予約を取得
            const seatReservations = reservationsData.filter(r =>
                r.seat_id === seat.seat_id &&
                ['reserved', 'in_use'].includes(r.status)
            );

            // セルを生成（空のtdを並べる）
            let cells = `<td class="tl-label">${seat.seat_name}${monitorIcon}</td>`;

            // 各スロットに対応するtdを生成
            // ブロックは最初のスロットのtdに absolute で描画
            const usedSlots = new Set(); // ブロックで使用済みのスロット

            for (let i = 0; i < TL_SLOTS; i++) {
                const slotStart = TL_START_MIN + i * TL_UNIT_MIN;
                const slotEnd   = slotStart + TL_UNIT_MIN;
                const isHour    = slotStart % 60 === 0;
                const isHalf    = slotStart % 30 === 0 && !isHour;
                const borderCls = isHour ? 'tl-border-hour' : isHalf ? 'tl-border-half' : 'tl-border-quarter';

                if (usedSlots.has(i)) {
                    cells += `<td class="tl-cell ${borderCls}" style="position:relative;"></td>`;
                    continue;
                }

                // このスロットから始まる予約を探す
                const reservation = seatReservations.find(r => {
                    const rStart = isoToAbsMin(r.start_datetime);
                    return rStart >= slotStart && rStart < slotEnd;
                });

                if (reservation) {
                    const rStart  = isoToAbsMin(reservation.start_datetime);
                    const rEnd    = isoToAbsMin(reservation.end_datetime);

                    // タイムライン範囲内にクリップ
                    const clampStart = Math.max(rStart, TL_START_MIN);
                    const clampEnd   = Math.min(rEnd,   TL_END_MIN);

                    const durationMin = clampEnd - clampStart;
                    const blockWidth  = (durationMin / TL_UNIT_MIN) * TL_CELL_PX; // px

                    // 開始スロット内でのオフセット（15分未満のずれに対応）
                    const offsetMin = clampStart - slotStart;
                    const offsetPx  = (offsetMin / TL_UNIT_MIN) * TL_CELL_PX;

                    // 使用スロットを記録（重複描画防止）
                    const spanSlots = Math.ceil(durationMin / TL_UNIT_MIN);
                    for (let j = i + 1; j < i + spanSlots; j++) usedSlots.add(j);

                    const blockClass = reservation.status === 'in_use' ? 'in_use' : 'reserved';
                    const timeLabel  = `${formatTime(reservation.start_datetime)}〜${formatTime(reservation.end_datetime)}`;

                    cells += `
                        <td class="tl-cell ${borderCls}" style="position:relative; overflow:visible;">
                            <div class="tl-block ${blockClass}"
                                 style="left:${offsetPx}px; width:${blockWidth}px;"
                                 title="${timeLabel}">
                                ${timeLabel}
                            </div>
                        </td>`;
                } else {
                    cells += `<td class="tl-cell ${borderCls}"></td>`;
                }
            }

            return `<tr>${cells}</tr>`;
        }).join('');

        wrap.innerHTML = `
            <table class="timeline-table">
                <thead><tr>${headerCells}</tr></thead>
                <tbody>${rows}</tbody>
            </table>
        `;
    });
}

// ============================================================
// 予約モーダル
// ============================================================
function openModal(seatId, seatName) {
    document.getElementById('formSeatId').value   = seatId;
    document.getElementById('formSeatName').value = seatName;
    document.getElementById('formUserName').value = '';
    document.getElementById('formEmail').value    = '';
    document.getElementById('modalOverlay').classList.add('open');
}

function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
}

document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});

async function submitReservation() {
    const seatId    = document.getElementById('formSeatId').value;
    const userName  = document.getElementById('formUserName').value.trim();
    const email     = document.getElementById('formEmail').value.trim();
    const startTime = document.getElementById('formStartTime').value;
    const endTime   = document.getElementById('formEndTime').value;

    if (!userName) { showToast('⚠️ 予約者名を入力してください'); return; }
    if (!email)    { showToast('⚠️ メールアドレスを入力してください'); return; }

    const today = new Date().toISOString().split('T')[0];

    const payload = {
        user_id        : 1,
        seat_id        : parseInt(seatId),
        start_datetime : `${today}T${toHHMM(startTime)}:00`,
        end_datetime   : `${today}T${toHHMM(endTime)}:00`,
        status         : 'reserved',
    };

    try {
        const res = await fetch(`${API_BASE}/api/reservations`, {
            method  : 'POST',
            headers : { 'Content-Type': 'application/json' },
            body    : JSON.stringify(payload),
        });

        if (!res.ok) {
            const err = await res.json();
            throw new Error(err.detail || `エラー: ${res.status}`);
        }

        closeModal();
        showToast('✅ 予約が完了しました');
        await refreshData();

    } catch (error) {
        console.error('[予約] 失敗:', error);
        showToast(`❌ 予約に失敗しました: ${error.message}`);
    }
}

// ============================================================
// キャンセル確認ダイアログ
// ============================================================
let pendingCancelId = null;

function openConfirm(reservationId, seatName, timeRange) {
    pendingCancelId = reservationId;
    document.getElementById('confirmText').textContent =
        `「${seatName}」の予約（${timeRange}）をキャンセルします。`;
    document.getElementById('confirmOkBtn').onclick = executeCancel;
    document.getElementById('confirmOverlay').classList.add('open');
}

function closeConfirm() {
    pendingCancelId = null;
    document.getElementById('confirmOverlay').classList.remove('open');
}

async function executeCancel() {
    if (!pendingCancelId) return;
    closeConfirm();

    try {
        const res = await fetch(
            `${API_BASE}/api/reservations/cancel/${pendingCancelId}`,
            { method: 'POST' }
        );

        if (!res.ok) {
            const err = await res.json();
            throw new Error(err.detail || `エラー: ${res.status}`);
        }

        showToast('✅ 予約をキャンセルしました');
        await refreshData();

    } catch (error) {
        console.error('[キャンセル] 失敗:', error);
        showToast(`❌ キャンセルに失敗しました: ${error.message}`);
    }
}

// ============================================================
// データ取得
// ============================================================
async function loadFloors() {
    try {
        const res = await fetch(`${API_BASE}/api/floors`);
        if (!res.ok) throw new Error(`API エラー: ${res.status}`);
        floorsData = await res.json();
        console.log(`[API] フロア: ${floorsData.length}件`, floorsData);
    } catch (e) {
        console.warn('[API] フロアデータ取得失敗:', e);
        floorsData = [];
    }
}

async function loadSeats() {
    try {
        const res = await fetch(`${API_BASE}/api/seats`);
        if (!res.ok) throw new Error(`API エラー: ${res.status}`);
        seatsData = await res.json();
        console.log(`[API] 席: ${seatsData.length}件`);
    } catch (e) {
        console.error('[API] 席データ取得失敗:', e);
        showError(`データの取得に失敗しました: ${e.message}`);
    }
}

async function loadReservations() {
    try {
        const res = await fetch(`${API_BASE}/api/reservations`);
        if (!res.ok) throw new Error(`API エラー: ${res.status}`);
        reservationsData = await res.json();
        console.log(`[API] 予約: ${reservationsData.length}件`);
    } catch (e) {
        console.error('[API] 予約データ取得失敗:', e);
        reservationsData = [];
    }
}

async function refreshData() {
    await loadSeats();
    await loadReservations();
    renderSeats();
    renderTimelines();
}

// ============================================================
// SignalR
// ============================================================
async function connectSignalR() {
    const dot  = document.getElementById('statusDot');
    const text = document.getElementById('statusText');
    dot.className    = 'status-dot connecting';
    text.textContent = '接続中...';

    try {
        const r    = await fetch(`${API_BASE}/api/negotiate/negotiate`, { method: 'POST' });
        const data = await r.json();
        if (data.disabled) {
            dot.className    = 'status-dot disconnected';
            text.textContent = 'リアルタイム更新無効';
            return;
        }
    } catch (e) {
        console.warn('[SignalR] ネゴシエーション失敗:', e);
    }

    const connection = new signalR.HubConnectionBuilder()
        .withUrl(`${API_BASE}/api/negotiate`)
        .withAutomaticReconnect([0, 3000, 10000, 30000])
        .configureLogging(signalR.LogLevel.Warning)
        .build();

    connection.on('seatStatusUpdated', async (payload) => {
        console.log('[SignalR] 受信:', payload);
        await refreshData();
    });

    connection.onclose(()      => { dot.className = 'status-dot disconnected'; text.textContent = '切断'; });
    connection.onreconnecting( () => { dot.className = 'status-dot connecting';   text.textContent = '再接続中...'; });
    connection.onreconnected(  () => { dot.className = 'status-dot connected';    text.textContent = 'リアルタイム接続中'; });

    try {
        await connection.start();
        dot.className    = 'status-dot connected';
        text.textContent = 'リアルタイム接続中';
    } catch (e) {
        dot.className    = 'status-dot disconnected';
        text.textContent = 'SignalR 接続失敗';
        setTimeout(connectSignalR, 10000);
    }
}

// ============================================================
// ユーティリティ
// ============================================================
function showError(message) {
    const el = document.getElementById('errorMessage');
    el.textContent   = message;
    el.style.display = 'block';
}

let toastTimer = null;
function showToast(message) {
    const el = document.getElementById('toast');
    el.textContent   = message;
    el.style.display = 'block';
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.style.display = 'none'; }, 3000);
}

/** "2025-06-10T09:00:00" → "9:00" */
function formatTime(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return `${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
}

/** ISO文字列 → 今日の絶対分（0時からの分） */
function isoToAbsMin(iso) {
    if (!iso) return 0;
    const d = new Date(iso);
    return d.getHours() * 60 + d.getMinutes();
}

/** ISO文字列 → 今日の絶対分（isoToAbsMinのエイリアス） */
function timeToMinutesFromISO(iso) {
    return isoToAbsMin(iso);
}

/** "9:00" → 540 */
function timeToMinutes(str) {
    if (!str) return 0;
    const [h, m] = str.split(':').map(Number);
    return h * 60 + (m || 0);
}

/** "9:00" → "09:00" */
function toHHMM(str) {
    const [h, m] = str.split(':');
    return `${h.padStart(2,'0')}:${(m || '00').padStart(2,'0')}`;
}

// ============================================================
// 起動
// ============================================================
document.addEventListener('DOMContentLoaded', async () => {
    console.log('🚀 アプリ起動');

    await loadFloors();
    await loadSeats();
    await loadReservations();

    buildFloorTabs();
    renderSeats();
    renderTimelines();

    // 1分ごとに画面を自動更新（予約時間内ステータス反映のため）
    setInterval(async () => {
        await refreshData();
    }, 60 * 1000);

    await connectSignalR();
});
</script>
